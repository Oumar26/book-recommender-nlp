[project]
name = "book-recommender"
version = "0.1.0"
description = "Recommandation sémantique et explicable de livres (SBERT multilingue, scoring pondéré)."
requires-python = ">=3.11"
# Cœur : nettoyage, scoring, API. Suffit pour les tests et l'app (hors encodeurs NLP).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# Modèles NLP : encodeurs, zero-shot, KeyBERT, Word2Vec, UMAP. Lourd (torch) ; utilisé ici sur CPU et sur Colab (GPU).
nlp = [
    "torch>=2.4",
    "sentence-transformers>=3.2",
    "transformers>=4.45",
    "keybert>=0.8",
    "gensim>=4.3",
    "umap-learn>=0.5",
]

[project.scripts]
book-recommender = "book_recommender.main.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

notebooks = [
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/book_recommender"]

# En local, torch est pris sur l'index CPU (évite ~2 Go de bibliothèques CUDA).
# Sur Colab, `pip install -e "backend[nlp]"` garde le torch CUDA déjà installé.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E501", "E702"]
